<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This is a login page">
    <link rel="short icon" type="x-icon" href="logo.webp">
    <link rel="stylesheet" href="log-page.css">
    <title>Login-page</title>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Welcome Back.</h1>
            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Rem, est?</p>
            <h2>Login</h2>
            <div class="pop">
                Don't have an account?<a href="#">Create your account</a>
            </div>
        </div>
        <form id="loginform"action="">
           <div class="from-group">
             <input type="text" id="name" placeholder="Username">
           </div>
           <div class="form-group">
             <input type="password" id="password" placeholder="Password">
           </div>
           <div class="remember-forgot">
            <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>
                <div class="forgot-password">
                    <a href="#">Forgot password?</a>
                </div>
           </div>
            <button type="submit" class="login-button">Login</button>
        </form>
         <div class="login-footer">
           <nav class="logo">
            Or login With
            <a href="#facebook"></a>
            <a href="#twiter"></a>
           </nav>
        </div>

    </div>
    
</body>
</html>
