<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>strore value</title>
    
</head>
<body>
    <input type="number" placeholder="Enter number" value="100" id="input1"><br><br>
    <input type="number" placeholder="Enter number" value="200" id="input2">
    <div id="div1"></div>
    <script>
        let n1=document.getElementById("input1").value
        let n2=document.getElementById("input2").value
        let addition=Number(n1)+Number(n2)
        console.log(addition)
        document.getElementById("div1").innerHTML=addition
    </script>
</body>
</html>
