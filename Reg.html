<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registation form</title>
</head>
<body style="background-color: #f0f8ff; padding: 20px; ">
   <form action="www.google.com" method="post">
     <fieldset>
        <h2 ><u>Registation form</u></h2>
        <label for="name">First Name</label>
        <input type="text" id="name" name="name"  required><br><br>
        <label for="lname">Last Name</label>
        <input type="text" id="lname" name="lname" required><br><br>
        <label for="nick">Nick Name</label>
        <input type="text" id="nick" name="nick" required><br><br>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required><br><br>
        <label for="pass">Password</label>
        <input type="password" id="pass" name="pass" required><br><br>
        <label for="date">Date of Birth</label>
        <input type="date" id="date" name="date" required><br><br>
        <label for="gender">Gender</label>
        <label for="gen-male">
            <input type="radio" id="gen-male"name="gender" value="male"> Male
        </label>
        <label for="gen-female">
            <input type="radio" id="gen" name="gender" value="female"> Female
        </label>
        <label for="gen-other">
            <input type="radio" id="gen-other"  name="gender"> Other
        </label><br><br>
        <label for="number">Mobile</label>
        <input type="tel" id="number" name="number"  required><br><br>
        <label for="address">Address</label>
        <input type="text" id="address" name="address" required><br><br>
     <input type="submit" value="Submit">
     <input type="reset" value="Reset"  >
    </fieldset>
   </form>

</body>
</html>
