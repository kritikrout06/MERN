<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button set</title>
</head>
<body>
    <h1>It's a angry moment.</h1>
    <br>
    <button onclick="document.getElementById('picture').src='monkey.jpg'">Turn OFF</button>
    <img id="picture" src="monkey.jpg" alt="Here is monky image" style="width: 500px;">
    <button onclick="document.getElementById('picture').src='monkey1.jpg'">Turn ON</button>
</body>
</html>
