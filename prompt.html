<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Use of prompt</title>
</head>
<body>
   <button onclick="doSome(prompt('Enter value of a:',''),prompt('Enter value of b:',''))">click</button> 
   <script>
     let doSome=(a,b)=>{
        let c=eval(a)+eval(b)
        alert (c)
     }
     
 
   </script>
</body>
</html>
