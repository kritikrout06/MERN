<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mordarian Paint</title>
    <link rel="stylesheet" href="mode.css">
</head>
<body>
    <table border="2" padding="10" cellspacing="0">
        <tr>
            <th class="first">hi</th>
            <th colspan="2">hi</th>
            <th class="second" >hi</th>
            <th>hi</th>
            <th>hi</th>
        </tr>
        <tr>
            <th rowspan="4">hi</th>
            <th class="third" colspan="2">hi</th>
            <th class="forth">hi</th>
            <th colspan="3">hi</th>
            <th class="third" colspan="3">hi</th>
        </tr>
        <tr>
            <th class="first" rowspan="2">hi</th>
            <th class="forth" rowspan="2">hi</th>
            <th class="first">hi</th>
        </tr>
        <tr>
            <th class="second">hi</th>
        </tr>
        <tr>
            <th colspan="3">hi</th>
            <th class="forth" colspan="2">hi</th>
        </tr>
        <tr>
            <th>hi</th>
            <th colspan="2">hi</th>
            <th class="third" colspan="3">hi</th>
        </tr>
    </table>
</body>
</html>
