<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key up Event</title>
    <script>
        function displayText() {
            let inputField = document.getElementById("inputField").value;
          document.getElementById("displayText").innerText = inputField.toUpperCase();
           
        }
    </script>
</head>
<body>
    <!-- <input type="text" id="inputField" placeholder="Type something..." onkeyup="displayText()"><br><br> -->
     <input type="text" id="inputField" placeholder="Type something..." onkeydown="displayText()"><br><br>
     <!-- <input type="text" id="inputField" placeholder="Type something..." onkeyup="displayText()"><br><br> -->
    your input: <span id="displayText"></span>
</body>
</html>
